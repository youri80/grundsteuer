{{/*
  ServiceAccount.
  Standardmaessig nicht angelegt: die App greift nicht auf die Kubernetes-API zu und braucht
  daher keine Berechtigungen. Der Pod nutzt dann den 'default'-ServiceAccount des Projekts.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grundsteuer.serviceAccountName" . }}
  labels:
    {{- include "grundsteuer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
