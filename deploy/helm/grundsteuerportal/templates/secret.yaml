{{/*
  Salt zur Pseudonymisierung der Steueridentifikationsnummer (§ 139 AO).

  Warum als Secret und nicht im ConfigMap oder Image: das Salt ist der einzige Schutz fuer die
  gespeicherten Hashes. Wer es kennt und Zugriff auf die Datenbank hat, kann IdNr-Kandidaten
  durchrechnen. Es gehoert deshalb in ein Secret - und darf auch nicht als Klartext-'value' in
  der Pod-Vorlage stehen, sonst waere es wieder im Deployment-Manifest lesbar.

  ACHTUNG: ein Wechsel des Salts macht bestehende Hashes unvergleichbar. Die letzten drei
  Stellen zur Wiedererkennung bleiben erhalten, der Rest muesste neu erfasst werden.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grundsteuer.fullname" . }}
  labels:
    {{- include "grundsteuer.labels" . | nindent 4 }}
type: Opaque
stringData:
  Datenbank__IdNrSalt: {{ .Values.app.idNrSalt | quote }}
